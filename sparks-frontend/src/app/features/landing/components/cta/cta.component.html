<section class="cta section section--bg-navy">
  <div class="cta__glow" aria-hidden="true"></div>
  <div class="container cta__inner" spReveal>
    <span class="cta__kicker">
      <sp-icon name="sparkles" [size]="13"></sp-icon>
      Join the SPARKS ecosystem
    </span>
    <h2>Ready to make support smarter?</h2>
    <p>Give your PLM support team intelligent qualification, fair routing, and faster resolutions.</p>
    <a class="sp-btn sp-btn--accent sp-btn--lg" routerLink="/login">
      Enter SPARKS
      <sp-icon name="arrow-right" [size]="18"></sp-icon>
    </a>
  </div>
</section>
