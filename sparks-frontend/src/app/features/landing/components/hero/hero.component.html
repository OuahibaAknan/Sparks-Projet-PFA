<section class="hero" id="top">
  <div class="hero__glow" aria-hidden="true"></div>

  <div class="container hero__inner">
    <div class="hero__text" spReveal>
      <span class="hero__eyebrow">
        <sp-icon name="sparkles" [size]="13"></sp-icon>
        AI-powered PLM support
      </span>
      <h1>Smarter Tickets.<br />Faster Resolution.<br />Intelligent Support.</h1>
      <p>
        SPARKS centralizes, qualifies and intelligently routes PLM support tickets, empowering
        Generalists and Specialists to resolve incidents faster and more efficiently.
      </p>
      <div class="hero__actions">
        <a class="sp-btn sp-btn--accent" routerLink="/login">
          Explore SPARKS
          <sp-icon name="arrow-right" [size]="16"></sp-icon>
        </a>
        <a class="sp-btn sp-btn--outline" href="#smartticket-ai">Discover SmartTicket AI</a>
      </div>
    </div>

    <div class="hero__visual" [spReveal]="120">
      <sp-hero-orbit></sp-hero-orbit>
    </div>
  </div>

  <div class="hero__scroll-cue">
    <sp-icon name="chevron-down" [size]="18"></sp-icon>
  </div>
</section>
