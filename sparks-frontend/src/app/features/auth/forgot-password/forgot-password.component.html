<div class="fp">
  <div class="fp__card">
    <div class="fp__logo"><img src="/logo-sparks-mark.png" alt="SPARKS" class="fp__logo-img" /></div>

    <ng-container *ngIf="step() === 'email'">
      <h2>Forgot your password?</h2>
      <p class="fp__sub">Enter your email and we'll send you a verification code.</p>

      <form (ngSubmit)="submitEmail()">
        <label class="sp-label" for="email">Email address</label>
        <input
          id="email"
          class="sp-input"
          type="email"
          name="email"
          placeholder="first.last@alten.com"
          [(ngModel)]="email"
          autocomplete="username"
        />

        <p class="fp__error" *ngIf="error()">{{ error() }}</p>

        <button class="sp-btn sp-btn--primary fp__submit" type="submit" [disabled]="loading()">
          {{ loading() ? 'Sending…' : 'Send reset code' }}
        </button>
      </form>
    </ng-container>

    <ng-container *ngIf="step() === 'reset'">
      <h2>Enter your code</h2>
      <p class="fp__sub">We sent a 6-digit code to {{ email }}. Enter it below with your new password.</p>

      <p class="fp__success" *ngIf="success()">
        <sp-icon name="check-circle" [size]="16"></sp-icon>
        Password reset successfully. Redirecting to login…
      </p>

      <form (ngSubmit)="submitReset()" *ngIf="!success()">
        <label class="sp-label" for="code">Verification code</label>
        <input id="code" class="sp-input" type="text" name="code" placeholder="123456" maxlength="6" [(ngModel)]="code" />

        <label class="sp-label" for="newPassword">New password</label>
        <input
          id="newPassword"
          class="sp-input"
          type="password"
          name="newPassword"
          placeholder="At least 8 characters, mixed case, digit, symbol"
          [(ngModel)]="newPassword"
          autocomplete="new-password"
        />

        <label class="sp-label" for="confirmPassword">Confirm new password</label>
        <input
          id="confirmPassword"
          class="sp-input"
          type="password"
          name="confirmPassword"
          placeholder="••••••••"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
        />

        <p class="fp__error" *ngIf="error()">{{ error() }}</p>

        <button class="sp-btn sp-btn--primary fp__submit" type="submit" [disabled]="loading()">
          {{ loading() ? 'Resetting…' : 'Reset password' }}
        </button>
      </form>
    </ng-container>

    <a class="fp__back" routerLink="/login">Back to login</a>
  </div>
</div>
