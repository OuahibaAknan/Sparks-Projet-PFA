<div class="cp" *ngIf="auth.currentUser() as user">
  <div class="cp__header">
    <h1>Change your password</h1>
    <p *ngIf="user.mustChangePassword">
      <sp-icon name="alert-triangle" [size]="14"></sp-icon>
      For security, you must change your temporary password before continuing.
    </p>
    <p *ngIf="!user.mustChangePassword">Update the password for your SPARKS account.</p>
  </div>

  <div class="sp-card cp__card">
    <p class="cp__success" *ngIf="success()">
      <sp-icon name="check-circle" [size]="16"></sp-icon>
      Password changed successfully. Redirecting…
    </p>

    <form (ngSubmit)="submit()" *ngIf="!success()">
      <label class="sp-label" for="currentPassword">Current password</label>
      <input
        id="currentPassword"
        class="sp-input"
        [type]="showPasswords ? 'text' : 'password'"
        name="currentPassword"
        placeholder="••••••••"
        [(ngModel)]="currentPassword"
        autocomplete="current-password"
      />

      <label class="sp-label" for="newPassword">New password</label>
      <input
        id="newPassword"
        class="sp-input"
        [type]="showPasswords ? 'text' : 'password'"
        name="newPassword"
        placeholder="At least 8 characters, mixed case, digit, symbol"
        [(ngModel)]="newPassword"
        autocomplete="new-password"
      />

      <label class="sp-label" for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        class="sp-input"
        [type]="showPasswords ? 'text' : 'password'"
        name="confirmPassword"
        placeholder="••••••••"
        [(ngModel)]="confirmPassword"
        autocomplete="new-password"
      />

      <button type="button" class="cp__toggle" (click)="showPasswords = !showPasswords">
        <sp-icon [name]="showPasswords ? 'eye-off' : 'eye'" [size]="14"></sp-icon>
        {{ showPasswords ? 'Hide passwords' : 'Show passwords' }}
      </button>

      <p class="cp__error" *ngIf="error()">{{ error() }}</p>

      <button class="sp-btn sp-btn--primary cp__submit" type="submit" [disabled]="loading()">
        <sp-icon name="lock" [size]="16"></sp-icon>
        {{ loading() ? 'Changing…' : 'Change password' }}
      </button>
    </form>
  </div>
</div>
